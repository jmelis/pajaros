name: CI / Build / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/validate.js

  build-web:
    name: Build web catalog
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/build-catalog.js
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-json
          path: catalog.json

  build-pdf:
    name: Build PDFs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/build-catalog.js
      - name: Install Puppeteer dependencies
        run: npx puppeteer browsers install chrome
      - run: node scripts/generate-pdf.js
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: output/pdf/

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-web, build-pdf]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/build-catalog.js
      - name: Download PDFs
        uses: actions/download-artifact@v4.1.3
        with:
          name: pdfs
          path: output/pdf/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
