name: Deploy

# Mirrors `make deploy`/`make deploy-manifest` (see Makefile), but on a
# GitHub-hosted runner instead of the local machine, and pushes the manifest
# update itself instead of leaving that as a manual step -- ArgoCD picks up
# the commit in docker-compose-deployer and rolls it out automatically.

on:
  push:
    branches: [main]

env:
  IMAGE: quay.io/jmelis/birdquiz
  DEPLOYER_REPO: jmelis/docker-compose-deployer
  MANIFEST_PATH: k8s/applications/birdquiz/deployment.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pajaros
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Build linux/amd64 binary
        run: make server-linux

      - name: Compute image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Checkout docker-compose-deployer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOYER_REPO }}
          ssh-key: ${{ secrets.DEPLOYER_DEPLOY_KEY }}
          path: docker-compose-deployer

      - name: Update manifest and push
        working-directory: docker-compose-deployer
        run: |
          old=$(grep -oE '${{ env.IMAGE }}:[^"[:space:]]+' "${{ env.MANIFEST_PATH }}" | head -1)
          if [ -z "$old" ]; then
            echo "no ${{ env.IMAGE }} line in ${{ env.MANIFEST_PATH }}" >&2
            exit 1
          fi

          new="${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"
          if [ "$old" = "$new" ]; then
            echo "manifest already pins $new"
            exit 0
          fi

          sed -i "s|$old|$new|" "${{ env.MANIFEST_PATH }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "birdquiz ${{ steps.tag.outputs.tag }}"
          git push
