<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>birdsnearby</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">🐦</span>
    <h1>birdsnearby</h1>
    <span class="tagline" data-i18n="app.tagline"></span>
  </div>
  <div class="header-right">
    <a id="signInLink" class="header-signin" href="/login" data-i18n="auth.signIn" hidden></a>
  </div>
</header>

<main class="container">
  <!-- Home -->
  <section id="view-home" class="view" hidden>
    <div id="homeFirstRun" class="panel first-run" hidden>
      <p data-i18n="home.firstRun"></p>
      <div class="actions"><a class="btn btn-primary" href="#/search" data-i18n="home.find"></a></div>
    </div>

    <section id="homeAreasPanel">
      <h2 class="panel-title" data-i18n="home.areas"></h2>
      <ul id="homeFavorites" class="area-list"></ul>
    </section>

    <button id="homeNearMe" class="btn btn-secondary btn-block" type="button" data-i18n="home.nearMe"></button>
  </section>

  <!-- Search -->
  <section id="view-search" class="view map-view" hidden>
    <h2 class="sr-only" data-i18n="search.title"></h2>
    <div class="map-stage">
      <div id="map" data-i18n-aria="search.mapAria"></div>
      <div class="map-top">
        <div class="place-search">
          <input id="placeQuery" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="search.placePlaceholder" data-i18n-aria="search.title">
          <button class="clear-btn" type="button" data-clear="placeQuery" data-i18n-aria="search.clear" hidden>&times;</button>
          <ul id="placeSuggestions" class="place-suggestions" hidden></ul>
        </div>
      </div>
      <button id="useLocation" class="map-fab" type="button" data-i18n-aria="search.locateAria">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
      </button>
      <p id="mapHint" class="map-overlay-hint"></p>
      <p id="status" class="map-status" role="status"></p>
    </div>
    <form id="customForm" class="map-dock" hidden>
      <div id="stageHead" class="dock-head">
        <h3 id="stageName" class="stage-name"></h3>
        <p id="stageSub" class="area-subtitle"></p>
      </div>
      <div id="customRadiusLabel" class="radius-block">
        <div id="radiusChips" class="radius-chips" role="group" data-i18n-aria="search.presetsAria"></div>
        <label class="custom-radius"><span data-i18n="search.radius"></span>
          <input id="customRadius" type="range" min="0" max="1000" step="1">
          <output id="customRadiusValue" class="custom-radius-value"></output>
        </label>
      </div>
      <div class="dock-actions">
        <button id="stageSave" class="star-btn" type="button" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.26L21.5 9l-5 4.87L17.8 21 12 17.6 6.2 21l1.3-7.13-5-4.87 6.6-.74Z"/></svg>
        </button>
        <button id="useCircle" class="btn btn-secondary" type="button" data-i18n="search.useCircle" hidden></button>
        <button id="customGo" class="btn btn-primary" type="submit" data-i18n="search.customGo" disabled></button>
      </div>
    </form>
  </section>

  <!-- Species range -->
  <section id="view-range" class="view map-view" hidden>
    <h2 class="sr-only" data-i18n="range.title"></h2>
    <div class="map-stage">
      <div id="rangeMap" data-i18n-aria="range.mapAria"></div>
      <div class="map-top">
        <div class="place-search">
          <input id="speciesQuery" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="range.placeholder" data-i18n-aria="range.title">
          <button class="clear-btn" type="button" data-clear="speciesQuery" data-i18n-aria="search.clear" hidden>&times;</button>
          <ul id="speciesSuggestions" class="place-suggestions" hidden></ul>
        </div>
      </div>
      <p id="rangeHint" class="map-overlay-hint center" data-i18n="range.hint"></p>
      <p id="rangeStatus" class="map-status" role="status"></p>
      <div id="rangeBar" class="map-bar" hidden>
        <div id="rangeHead" class="bar-head">
          <h3 id="rangeName" class="stage-name"></h3>
          <p id="rangeSci" class="area-subtitle"></p>
        </div>
        <div class="range-controls">
          <select id="rangeMonth" class="month-select" data-i18n-aria="browse.monthAria" disabled></select>
          <div id="rangeLegend" class="range-legend" hidden>
            <span data-i18n="range.less"></span>
            <span class="range-ramp" aria-hidden="true"></span>
            <span data-i18n="range.more"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Area -->
  <section id="view-area" class="view" hidden>
    <div class="view-head">
      <div class="view-head-text">
        <h2 id="areaName" class="view-title"></h2>
        <p id="areaSub" class="area-subtitle"></p>
      </div>
      <div class="view-head-actions">
        <button id="bookmarkBtn" class="star-btn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.26L21.5 9l-5 4.87L17.8 21 12 17.6 6.2 21l1.3-7.13-5-4.87 6.6-.74Z"/></svg>
        </button>
        <button id="areaMenuBtn" class="star-btn" type="button" aria-haspopup="dialog" data-i18n-aria="sheet.more">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </div>
    <p id="areaStatus" class="status"></p>
    <div id="browseControls">
      <div class="sort-row">
        <button id="learnStart" class="btn btn-primary btn-sm" type="button" data-i18n="area.learn"></button>
        <select id="monthSelect" class="pill-select" data-i18n-aria="browse.monthAria"></select>
        <select id="sortSelect" class="pill-select" data-i18n-aria="browse.sortAria">
          <option value="popularity" data-i18n="browse.popularity"></option>
          <option value="category" data-i18n="browse.category"></option>
          <option value="alphabetical" data-i18n="browse.alphabetical"></option>
        </select>
      </div>
      <div id="groups"></div>
    </div>
  </section>

  <!-- Compare two areas -->
  <section id="view-compare" class="view" hidden>
    <a id="compareBack" class="back-link" href="#/home" data-i18n="compare.back"></a>
    <h2 class="view-title" data-i18n="compare.title"></h2>
    <div id="comparePicker" class="cmp-pick"></div>
    <p id="compareDist" class="cmp-dist"></p>
    <p id="compareStatus" class="status"></p>
    <div id="compareBody" class="view"></div>
  </section>

  <!-- About: contact, data sources, privacy -->
  <section id="view-about" class="view" hidden>
    <a class="back-link" href="#/settings" data-i18n="about.back"></a>
    <h2 class="view-title" data-i18n="about.title"></h2>
    <p data-i18n="about.intro"></p>
    <div id="aboutContact" hidden>
      <h3 class="about-h" data-i18n="about.contactTitle"></h3>
      <p id="aboutContactSignIn" class="hint" hidden><a id="aboutContactLogin" href="/login" data-i18n="about.contactSignIn"></a></p>
      <form id="aboutContactForm" class="contact-form" hidden>
        <label class="field">
          <span data-i18n="about.contactLabel"></span>
          <textarea id="contactMessage" rows="5" maxlength="4000" required></textarea>
        </label>
        <div class="contact-actions">
          <button id="contactSend" class="btn btn-primary" type="submit" data-i18n="about.contactSend"></button>
          <p id="contactStatus" class="status" role="status"></p>
        </div>
      </form>
    </div>
    <h3 class="about-h" data-i18n="about.dataTitle"></h3>
    <p class="hint" data-i18n="about.dataIntro"></p>
    <ul class="about-list">
      <li><a href="https://www.gbif.org/dataset/4fa7b334-ce0d-4e88-aaae-2e0c138d049e" target="_blank" rel="noopener">eBird Observation Dataset (via GBIF)</a> <span data-i18n="about.src.obs"></span></li>
      <li><a href="https://ebird.org/science/use-ebird-data/the-ebird-taxonomy" target="_blank" rel="noopener">eBird / Clements taxonomy</a> <span data-i18n="about.src.tax"></span></li>
      <li><a href="https://www.worldbirdnames.org/" target="_blank" rel="noopener">IOC World Bird List</a> <span data-i18n="about.src.ioc"></span></li>
      <li><a href="https://www.gbif.org/species/search" target="_blank" rel="noopener">GBIF species API</a> <span data-i18n="about.src.gbif"></span></li>
      <li><a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> <span data-i18n="about.src.ne"></span></li>
      <li><a href="https://db-ip.com/db/download/ip-to-country-lite" target="_blank" rel="noopener">DB-IP IP to Country Lite</a> <span data-i18n="about.src.dbip"></span></li>
      <li><a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> <span data-i18n="about.src.wm"></span></li>
      <li><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> <span data-i18n="about.src.osm"></span></li>
      <li><a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a> <span data-i18n="about.src.leaf"></span></li>
    </ul>
    <h3 class="about-h" data-i18n="about.privacyTitle"></h3>
    <p class="hint" data-i18n="about.privacy"></p>
  </section>

  <!-- Photo credits for one species -->
  <section id="view-credits" class="view" hidden>
    <a id="creditsBack" class="back-link" href="#/home" data-i18n="credits.back"></a>
    <h2 class="view-title" data-i18n="credits.title"></h2>
    <p class="hint" data-i18n="credits.intro"></p>
    <p id="creditsStatus" class="status"></p>
    <ul id="creditsList" class="credits-list"></ul>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view" hidden>
    <h2 class="view-title" data-i18n="settings.title"></h2>
    <section class="panel settings-body">
      <p id="settingsEmail" class="settings-email" hidden></p>
      <label class="field"><span data-i18n="settings.primary"></span>
        <select id="primaryLang"></select>
      </label>
      <label class="field"><span data-i18n="settings.secondary"></span>
        <select id="secondaryLang"></select>
      </label>
      <div class="actions">
        <button id="logoutBtn" class="btn btn-secondary" type="button" data-i18n="settings.signOut"></button>
        <a id="settingsSignIn" class="btn btn-primary" href="/login" data-i18n="auth.signIn" hidden></a>
      </div>
      <p id="settingsGuestHint" class="hint" data-i18n="settings.guestHint" hidden></p>
      <p id="settingsHint" class="hint" hidden></p>
      <a class="link-row" href="#/about" data-i18n="about.link"></a>
    </section>
  </section>
</main>

<nav class="app-nav tab-bar" data-i18n-aria="nav.aria">
  <a href="#/home" data-nav="home">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
    <span data-i18n="nav.home"></span>
  </a>
  <a href="#/search" data-nav="search">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <span data-i18n="nav.search"></span>
  </a>
  <a href="#/range" data-nav="range">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg>
    <span data-i18n="nav.range"></span>
  </a>
  <a href="#/settings" data-nav="settings">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    <span data-i18n="nav.settings"></span>
  </a>
</nav>

<div id="learnOverlay" class="overlay learn-overlay" hidden>
  <div class="learn-top">
    <button id="learnClose" class="learn-icon-btn" type="button" data-i18n-aria="learn.back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="learn-top-actions">
      <button id="learnToggleNames" class="learn-icon-btn" type="button" data-i18n-aria="learn.hideNames" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="learnShare" class="learn-icon-btn" type="button" data-i18n-aria="learn.share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      </button>
      <button id="learnMenu" class="learn-icon-btn" type="button" aria-haspopup="dialog" data-i18n-aria="sheet.more">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>
  </div>
  <div id="learnBody" class="learn-body"></div>
  <div class="learn-nav">
    <button id="learnPrev" class="learn-nav-btn" type="button" data-i18n-aria="learn.previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span id="learnProgress" class="learn-progress"></span>
    <button id="learnNext" class="learn-nav-btn" type="button" data-i18n-aria="learn.next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <div class="sheet-grab" aria-hidden="true"></div>
    <h2 id="sheetTitle" class="sheet-title"></h2>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden>
  <span id="toastText"></span>
  <button id="toastAction" class="toast-action" type="button" hidden></button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/compare.js"></script>
<script src="/app.js"></script>
</body>
</html>
