<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>birdquiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">🐦</span>
    <h1>birdquiz</h1>
    <span class="tagline" data-i18n="app.tagline"></span>
  </div>
  <div class="header-right">
    <span id="userEmail" class="user-email"></span>
    <a id="signInLink" class="header-signin" href="/login" data-i18n="auth.signIn" hidden></a>
  </div>
</header>

<main class="container">
  <!-- Home -->
  <section id="view-home" class="view" hidden>
    <div id="homeGuest" class="panel first-run" hidden>
      <p data-i18n="home.guest"></p>
      <div class="actions">
        <a id="homeSignIn" class="btn btn-primary" href="/login" data-i18n="auth.signIn"></a>
      </div>
    </div>

    <div id="homeFirstRun" class="panel first-run" hidden>
      <p data-i18n="home.firstRun"></p>
      <div class="actions"><a class="btn btn-primary" href="#/search" data-i18n="home.find"></a></div>
    </div>

    <section id="homeGreetingPanel" class="hero">
      <p class="hero-greeting" data-i18n="home.greeting"></p>
    </section>

    <section id="homeHotspotsPanel">
      <div class="section-head">
        <h2 class="panel-title" data-i18n="home.hotspots"></h2>
        <button id="homeEditToggle" class="edit-link" type="button" hidden></button>
      </div>
      <ul id="homeFavorites" class="hotspot-list"></ul>
      <p id="homeNoFavorites" class="hint" data-i18n="home.noFavorites" hidden></p>
    </section>

    <a class="cta-primary" href="#/search" data-i18n="home.find"></a>
    <a id="homeCompareLink" class="cmp-link" href="#/compare" data-i18n="home.compare" hidden></a>
    <footer class="credits-footer"><a href="#/contact" data-i18n="contact.link"></a></footer>
  </section>

  <!-- Search -->
  <section id="view-search" class="view" hidden>
    <h2 class="view-title" data-i18n="search.title"></h2>
    <section class="panel">
      <div class="place-search">
        <input id="placeQuery" type="search" autocomplete="off" data-i18n-placeholder="search.placePlaceholder">
        <ul id="placeSuggestions" class="place-suggestions" hidden></ul>
      </div>
      <div class="actions">
        <button id="useLocation" class="btn btn-secondary" type="button" data-i18n="search.useLocation"></button>
      </div>
      <input id="lat" type="hidden" value="50.8503">
      <input id="lng" type="hidden" value="4.3517">
      <p class="hint" data-i18n="search.hint"></p>
    </section>
    <section class="panel map-panel">
      <div class="map-toolbar">
        <button id="searchHere" class="btn btn-secondary btn-sm" type="button" data-i18n="search.here"></button>
      </div>
      <div id="map" data-i18n-aria="search.mapAria"></div>
    </section>
    <p id="status" class="status"></p>
  </section>

  <!-- Hotspot -->
  <section id="view-hotspot" class="view" hidden>
    <div class="view-head">
      <h2 id="hotspotName" class="view-title"></h2>
      <div class="view-head-actions">
        <button id="shareHotspotBtn" class="star-btn" type="button" data-i18n-aria="hotspot.share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h14"/><path d="M21 12v7"/></svg>
        </button>
        <button id="bookmarkBtn" class="star-btn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.26L21.5 9l-5 4.87L17.8 21 12 17.6 6.2 21l1.3-7.13-5-4.87 6.6-.74Z"/></svg>
        </button>
      </div>
    </div>
    <p id="hotspotStatus" class="status"></p>
    <div id="browseControls">
      <div class="sort-row">
        <button id="learnStart" class="btn btn-primary btn-sm" type="button" data-i18n="hotspot.learn"></button>
        <div class="sort-control">
          <button id="sortBtn" class="sort-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="sortBtnLabel"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul id="sortMenu" class="sort-menu" role="listbox" hidden>
            <li role="option" data-value="popularity" data-i18n="browse.popularity"></li>
            <li role="option" data-value="category" data-i18n="browse.category"></li>
            <li role="option" data-value="alphabetical" data-i18n="browse.alphabetical"></li>
          </ul>
        </div>
      </div>
      <div class="segmented" id="modeToggle" role="radiogroup" data-i18n-aria="browse.modeAria" hidden>
        <label><input type="radio" name="mode" value="popularity" checked><span data-i18n="browse.popularity"></span></label>
        <label><input type="radio" name="mode" value="category"><span data-i18n="browse.category"></span></label>
        <label><input type="radio" name="mode" value="alphabetical"><span data-i18n="browse.alphabetical"></span></label>
      </div>
      <div id="groups"></div>
    </div>
    <footer class="credits-footer">
      <a id="hotspotCompareLink" href="#/compare" data-i18n="hotspot.compare"></a>
      <span aria-hidden="true"> · </span>
      <a id="hotspotCreditsLink" href="#/home" data-i18n="credits.link"></a>
    </footer>
  </section>

  <!-- Compare two hotspots -->
  <section id="view-compare" class="view" hidden>
    <a id="compareBack" class="back-link" href="#/home" data-i18n="compare.back"></a>
    <h2 class="view-title" data-i18n="compare.title"></h2>
    <div id="comparePicker" class="cmp-pick"></div>
    <p id="compareDist" class="cmp-dist"></p>
    <p id="compareStatus" class="status"></p>
    <div id="compareBody" class="view"></div>
  </section>

  <!-- Contact and data sources -->
  <section id="view-contact" class="view" hidden>
    <a class="back-link" href="#/settings" data-i18n="contact.back"></a>
    <h2 class="view-title" data-i18n="contact.title"></h2>
    <p data-i18n="contact.intro"></p>
    <p id="contactEmailRow" hidden><span data-i18n="contact.emailLabel"></span> <a id="contactEmail" href="#"></a></p>
    <h3 class="contact-h" data-i18n="contact.dataTitle"></h3>
    <p class="hint" data-i18n="contact.dataIntro"></p>
    <ul class="contact-list">
      <li><a href="https://www.gbif.org/dataset/4fa7b334-ce0d-4e88-aaae-2e0c138d049e" target="_blank" rel="noopener">eBird Observation Dataset (via GBIF)</a> <span data-i18n="contact.src.obs"></span></li>
      <li><a href="https://ebird.org/science/use-ebird-data/the-ebird-taxonomy" target="_blank" rel="noopener">eBird / Clements taxonomy</a> <span data-i18n="contact.src.tax"></span></li>
      <li><a href="https://www.worldbirdnames.org/" target="_blank" rel="noopener">IOC World Bird List</a> <span data-i18n="contact.src.ioc"></span></li>
      <li><a href="https://www.gbif.org/species/search" target="_blank" rel="noopener">GBIF species API</a> <span data-i18n="contact.src.gbif"></span></li>
      <li><a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> <span data-i18n="contact.src.geo"></span></li>
      <li><a href="https://db-ip.com/db/download/ip-to-country-lite" target="_blank" rel="noopener">DB-IP IP to Country Lite</a> <span data-i18n="contact.src.dbip"></span></li>
      <li><a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> <span data-i18n="contact.src.wm"></span></li>
      <li><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> <span data-i18n="contact.src.osm"></span></li>
      <li><a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a> <span data-i18n="contact.src.leaf"></span></li>
    </ul>
    <h3 class="contact-h" data-i18n="contact.privacyTitle"></h3>
    <p class="hint" data-i18n="contact.privacy"></p>
  </section>

  <!-- Photo credits for one hotspot -->
  <section id="view-credits" class="view" hidden>
    <a id="creditsBack" class="back-link" href="#/home" data-i18n="credits.back"></a>
    <h2 class="view-title" data-i18n="credits.title"></h2>
    <p id="creditsHotspot" class="credits-hotspot"></p>
    <p class="hint" data-i18n="credits.intro"></p>
    <p id="creditsStatus" class="status"></p>
    <ul id="creditsList" class="credits-list"></ul>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view" hidden>
    <h2 class="view-title" data-i18n="settings.title"></h2>
    <section class="panel settings-body">
      <label class="field"><span data-i18n="settings.primary"></span>
        <select id="primaryLang"></select>
      </label>
      <label class="field"><span data-i18n="settings.secondary"></span>
        <select id="secondaryLang"></select>
      </label>
      <div class="actions">
        <button id="logoutBtn" class="btn btn-secondary" type="button" data-i18n="settings.signOut"></button>
        <a id="settingsSignIn" class="btn btn-primary" href="/login" data-i18n="auth.signIn" hidden></a>
      </div>
      <p id="settingsGuestHint" class="hint" data-i18n="settings.guestHint" hidden></p>
      <p id="settingsHint" class="hint" hidden></p>
      <p class="hint" data-i18n="settings.credits"></p>
      <p class="hint"><a href="#/contact" data-i18n="contact.link"></a></p>
    </section>
  </section>
</main>

<nav class="app-nav tab-bar" data-i18n-aria="nav.aria">
  <a href="#/home" data-nav="home">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
    <span data-i18n="nav.home"></span>
  </a>
  <a href="#/search" data-nav="search">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <span data-i18n="nav.search"></span>
  </a>
  <a href="#/settings" data-nav="settings">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    <span data-i18n="nav.settings"></span>
  </a>
</nav>

<div id="learnOverlay" class="overlay learn-overlay" hidden>
  <div class="learn-top">
    <button id="learnClose" class="learn-icon-btn" type="button" data-i18n-aria="learn.back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <button id="learnPrev" class="learn-icon-btn" type="button" data-i18n-aria="learn.previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span id="learnProgress" class="learn-progress"></span>
    <button id="learnNext" class="learn-icon-btn" type="button" data-i18n-aria="learn.next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button id="learnToggleNames" class="learn-icon-btn" type="button" data-i18n-aria="learn.hideNames" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div id="learnBody" class="learn-body"></div>
  <footer class="learn-footer">
    <a id="learnCreditsLink" href="#/home" data-i18n="credits.link"></a>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/compare.js"></script>
<script src="/app.js"></script>
</body>
</html>
