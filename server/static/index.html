<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>pajaros</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --text: #1f2a24;
    --muted: #6b7a72;
    --accent: #2a7d4f;
    --accent-dark: #216040;
    --accent-soft: #eef4ef;
    --border: #e4e1da;

    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;

    --radius-sm: 8px;
    --radius: 12px;

    --shadow-sm: 0 1px 2px rgba(31, 42, 36, 0.06);
    --shadow: 0 2px 10px rgba(31, 42, 36, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { line-height: 1.25; letter-spacing: -0.01em; }
  a { color: var(--accent-dark); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: var(--space-1); }
  .brand h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
  .brand .tagline {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    max-width: 900px;
    margin: 0 auto;
    padding: var(--space-3) 1rem var(--space-4);
  }

  /* Panels / cards */
  .panel {
    padding: var(--space-3);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .panel-title {
    margin: 0 0 var(--space-2);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Buttons */
  .btn {
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
  .btn-sm { padding: 7px 12px; font-size: 0.85rem; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); }

  /* Inputs */
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: var(--space-2);
    margin-top: var(--space-2);
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span {
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  input[type=number], select {
    width: 100%;
    font: inherit;
    color: inherit;
    padding: 9px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  input[type=number]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(42, 125, 79, 0.15);
  }
  .hint { margin: var(--space-2) 0 0; color: var(--muted); font-size: 0.8rem; }

  /* Map */
  .map-panel { padding: 0; overflow: hidden; }
  .map-toolbar { padding: var(--space-2); border-bottom: 1px solid var(--border); }
  #map { height: 400px; }

  /* Mode segmented control */
  .segmented {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 3px;
    padding: 3px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .segmented label { display: inline-flex; cursor: pointer; }
  .segmented input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .segmented span {
    display: inline-block;
    padding: 7px 14px;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 600;
    border-radius: 6px;
    transition: background-color .15s ease, color .15s ease;
  }
  .segmented input:checked + span { background: var(--accent); color: #fff; }
  .segmented input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  #status { margin: var(--space-2) 0 0; color: var(--muted); font-size: 0.9rem; min-height: 1.4em; }

  /* Species cards */
  .family-heading {
    margin: var(--space-3) 0 var(--space-2);
    padding-bottom: var(--space-1);
    border-bottom: 1px solid var(--border);
    font-size: 1rem;
    font-weight: 700;
  }
  .family-heading:first-child { margin-top: 0; }

  .family-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: var(--space-2);
  }

  .card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    color: inherit;
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: #cdd8d0; box-shadow: var(--shadow); }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #eee;
  }
  .card-body { display: flex; flex-direction: column; gap: 2px; padding: var(--space-1) 10px 12px; }
  .card .com { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
  .card .sci { color: var(--muted); font-style: italic; font-size: 0.8rem; }
  .card .nearby {
    align-self: flex-start;
    margin-top: 4px;
    padding: 2px 9px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-size: 0.72rem;
    font-weight: 600;
    border-radius: 999px;
  }

  /* Leaflet popup */
  .leaflet-popup-content { margin: 12px 14px; font-family: inherit; color: var(--text); line-height: 1.5; }
  .leaflet-popup-content-wrapper { border-radius: var(--radius); box-shadow: var(--shadow); }
  .popup-title { font-size: 1rem; }
  .popup-btn {
    margin-top: var(--space-1);
    font: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 7px 12px;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .popup-btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  @media (max-width: 480px) {
    .container { padding: var(--space-2) var(--space-2) var(--space-3); }
    #map { height: 300px; }
    .brand .tagline { display: none; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1>pajaros</h1>
    <span class="tagline">field guide</span>
  </div>
  <button id="logoutBtn" class="btn btn-secondary btn-sm" type="button">Sign out</button>
</header>

<main class="container">
  <section class="panel" aria-labelledby="location-title">
    <h2 id="location-title" class="panel-title">Location</h2>
    <div class="actions">
      <button id="findHotspots" class="btn btn-primary" type="button">Find hotspots</button>
      <button id="useLocation" class="btn btn-secondary" type="button">📍 Use my location</button>
    </div>
    <div class="field-grid">
      <label class="field"><span>Latitude</span><input id="lat" type="number" step="any" value="50.8503"></label>
      <label class="field"><span>Longitude</span><input id="lng" type="number" step="any" value="4.3517"></label>
      <label class="field"><span>Language</span>
        <select id="lang">
          <option value="es" selected>es</option>
          <option value="fr">fr</option>
          <option value="en">en</option>
        </select>
      </label>
    </div>
    <p class="hint">Location access requires HTTPS or localhost — it will fail over plain http from another device.</p>
  </section>

  <section class="panel map-panel" aria-label="Hotspot map">
    <div class="map-toolbar">
      <button id="searchHere" class="btn btn-secondary btn-sm" type="button">🔍 Search this area of the map</button>
    </div>
    <div id="map"></div>
  </section>

  <section class="panel" aria-label="Species browsing">
    <div class="segmented" id="modeToggle" role="radiogroup" aria-label="Species browsing mode">
      <label><input type="radio" name="mode" value="popularity" checked><span>Popularity</span></label>
      <label><input type="radio" name="mode" value="category"><span>Category</span></label>
      <label><input type="radio" name="mode" value="alphabetical"><span>Alphabetical</span></label>
    </div>
    <p id="status">Click a hotspot marker on the map to load its species.</p>
  </section>

  <div id="groups"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function setStatus(msg) { $("status").textContent = msg; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Generic greyscale bird silhouette shown while a species' real photo is
// still being fetched (or if it never becomes available).
const PLACEHOLDER_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#e8e8e8"/>
  <g fill="#b5b5b5">
    <ellipse cx="45" cy="60" rx="28" ry="20"/>
    <circle cx="72" cy="42" r="14"/>
    <polygon points="84,42 96,38 84,48"/>
    <polygon points="20,55 4,50 20,68"/>
    <ellipse cx="40" cy="50" rx="14" ry="9" transform="rotate(-20 40 50)"/>
  </g>
  <circle cx="76" cy="38" r="2" fill="#e8e8e8"/>
</svg>`;
const PLACEHOLDER_URL = "data:image/svg+xml," + encodeURIComponent(PLACEHOLDER_SVG);

// Shown instead of PLACEHOLDER_SVG once the server has confirmed no
// freely-licensed photo exists for a species (sp.imageMissing) — same
// silhouette, marked with a red X so it doesn't read as "still loading".
const MISSING_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#e8e8e8"/>
  <g fill="#cbcbcb">
    <ellipse cx="45" cy="60" rx="28" ry="20"/>
    <circle cx="72" cy="42" r="14"/>
    <polygon points="84,42 96,38 84,48"/>
    <polygon points="20,55 4,50 20,68"/>
    <ellipse cx="40" cy="50" rx="14" ry="9" transform="rotate(-20 40 50)"/>
  </g>
  <circle cx="76" cy="38" r="2" fill="#e8e8e8"/>
  <line x1="10" y1="10" x2="90" y2="90" stroke="#c33" stroke-width="9" stroke-linecap="round"/>
  <line x1="90" y1="10" x2="10" y2="90" stroke="#c33" stroke-width="9" stroke-linecap="round"/>
</svg>`;
const MISSING_URL = "data:image/svg+xml," + encodeURIComponent(MISSING_SVG);

// Images are fetched server-side in the background (see /api/hotspots/.../species),
// so a card's imageUrl often 404s at first. Preload off-DOM and only swap the
// visible <img> once it actually loads, retrying for a couple of minutes —
// long enough to cover a big hotspot's background-fetch queue — before
// giving up and leaving the placeholder in place.
function preloadAndSwap(imgEl, url, attempt = 0) {
  const MAX_ATTEMPTS = 40;
  const RETRY_MS = 3000;
  const probe = new Image();
  probe.onload = () => { imgEl.src = url; };
  probe.onerror = () => {
    if (attempt < MAX_ATTEMPTS) setTimeout(() => preloadAndSwap(imgEl, url, attempt + 1), RETRY_MS);
  };
  probe.src = url;
}

const map = L.map("map").setView([parseFloat($("lat").value), parseFloat($("lng").value)], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

let userMarker = null;
let hotspotMarkers = [];

function clearHotspotMarkers() {
  for (const m of hotspotMarkers) map.removeLayer(m);
  hotspotMarkers = [];
}

function loadSpeciesButton(h) {
  return `<button class="popup-btn load-species-btn" data-locid="${h.locId}" data-locname="${escapeHtml(h.locName)}">Load species</button>`;
}

function popupHTML(h) {
  return `
    <strong class="popup-title">${escapeHtml(h.locName)}</strong><br>
    ${h.numChecklistsAllTime ?? 0} checklists &middot; ${h.numSpeciesAllTime ?? 0} species<br>
    ${loadSpeciesButton(h)}
  `;
}

// Deep-linked hotspots come from /api/hotspots/{locId} (single-hotspot info),
// which doesn't carry the checklist/species-count stats the nearby-search
// endpoint does — so its popup skips that line rather than showing zeroes.
function popupHTMLNoStats(h) {
  return `<strong class="popup-title">${escapeHtml(h.locName)}</strong><br>${loadSpeciesButton(h)}`;
}

const MIN_MARKER_RADIUS = 5;
const MAX_MARKER_RADIUS = 20;

// Checklist counts are heavily right-skewed (a handful of hotspots run into
// the tens of thousands, most are far smaller), so a log scale spreads that
// out much better than sqrt does. Scaled relative to the busiest hotspot in
// *this* search rather than a fixed global max, so the full size range is
// always used whether the area's counts run into the tens or the
// tens-of-thousands — the tradeoff is that the same hotspot can render at a
// different size depending on what else is nearby in the current search.
function markerRadius(checklists, maxChecklists) {
  if (maxChecklists <= 0) return MIN_MARKER_RADIUS;
  const t = Math.log1p(checklists || 0) / Math.log1p(maxChecklists);
  return MIN_MARKER_RADIUS + t * (MAX_MARKER_RADIUS - MIN_MARKER_RADIUS);
}

async function findHotspots() {
  const lat = parseFloat($("lat").value), lng = parseFloat($("lng").value);
  if (Number.isNaN(lat) || Number.isNaN(lng)) { setStatus("Enter valid lat/lng."); return; }

  setStatus("Loading hotspots...");
  const res = await fetch(`/api/hotspots?lat=${lat}&lng=${lng}`);
  if (!res.ok) { setStatus(`Error: ${res.status}`); return; }
  const hotspots = await res.json();

  clearHotspotMarkers();
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([lat, lng]).addTo(map).bindPopup("You are here");

  const bounds = L.latLngBounds([[lat, lng]]);
  const maxChecklists = Math.max(0, ...hotspots.map((h) => h.numChecklistsAllTime || 0));
  for (const h of hotspots) {
    const marker = L.circleMarker([h.lat, h.lng], {
      radius: markerRadius(h.numChecklistsAllTime, maxChecklists),
      color: "#2a7d4f",
      fillColor: "#2a7d4f",
      fillOpacity: 0.6,
    }).addTo(map).bindPopup(popupHTML(h));
    hotspotMarkers.push(marker);
    bounds.extend([h.lat, h.lng]);
  }
  if (hotspots.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
  setStatus(`${hotspots.length} hotspots found — click one on the map.`);
}

// Popup content is injected by Leaflet outside our control, so use event
// delegation instead of binding a listener per marker.
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("load-species-btn")) {
    loadSpecies(e.target.dataset.locid, e.target.dataset.locname);
  }
});

function setURLParams(params) {
  const url = new URL(window.location);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  history.replaceState({}, "", url);
}

function speciesCard(sp) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = `https://ebird.org/species/${encodeURIComponent(sp.speciesCode)}`;
  card.target = "_blank";
  card.rel = "noopener noreferrer";
  card.innerHTML = `
    <img src="${sp.imageMissing ? MISSING_URL : PLACEHOLDER_URL}" alt="${escapeHtml(sp.comName)}">
    <div class="card-body">
      <div class="com">${escapeHtml(sp.comName)}</div>
      <div class="sci">${escapeHtml(sp.sciName)}</div>
      ${sp.nearbyCount != null ? `<div class="nearby">${sp.nearbyCount} nearby reports</div>` : ""}
    </div>
  `;
  // imageMissing means the server already confirmed no photo exists — no
  // point polling a URL that will never 200.
  if (sp.imageUrl && !sp.imageMissing) preloadAndSwap(card.querySelector("img"), sp.imageUrl);
  return card;
}

let currentHotspot = null; // { locId, locName } — so the mode toggle can re-fetch

function currentMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

async function loadSpecies(locId, locName) {
  currentHotspot = { locId, locName };
  const lang = $("lang").value;
  const mode = currentMode();
  setURLParams({ locId, lang, mode });
  const groups = $("groups");
  groups.innerHTML = "";

  // popularity and alphabetical are both flat, sorted lists (server does the
  // sorting — see main.go) — only category needs family grouping client-side.
  const flatModeLabel = { popularity: "most reported nearby first", alphabetical: "alphabetical order" };
  if (mode in flatModeLabel) {
    const hint = mode === "popularity" ? " (checking nearby report counts, first load can take a few seconds)" : "";
    setStatus(`Loading species for ${locName}${hint}...`);
    const res = await fetch(`/api/hotspots/${locId}/species?lang=${lang}&mode=${mode}`);
    if (!res.ok) { setStatus(`Error: ${res.status}`); return; }
    const species = await res.json();
    const grid = document.createElement("div");
    grid.className = "family-grid";
    groups.appendChild(grid);
    for (const sp of species) grid.appendChild(speciesCard(sp));
    setStatus(`${species.length} species at ${locName}, ${flatModeLabel[mode]}.`);
    return;
  }

  setStatus(`Loading species for ${locName} (fetching images on first use can take a few seconds)...`);
  const res = await fetch(`/api/hotspots/${locId}/species?lang=${lang}&mode=category`);
  if (!res.ok) { setStatus(`Error: ${res.status}`); return; }
  const species = await res.json();

  // Species arrive already grouped by family (server sends eBird's
  // taxonomic order), so a family heading just goes up whenever it changes.
  let currentFamily = null;
  let currentGrid = null;
  for (const sp of species) {
    const family = sp.family || sp.order || "Other";
    if (family !== currentFamily) {
      currentFamily = family;
      const heading = document.createElement("h3");
      heading.className = "family-heading";
      heading.textContent = family;
      groups.appendChild(heading);
      currentGrid = document.createElement("div");
      currentGrid.className = "family-grid";
      groups.appendChild(currentGrid);
    }
    currentGrid.appendChild(speciesCard(sp));
  }
  setStatus(`${species.length} species at ${locName}, grouped by family.`);
}

for (const radio of document.querySelectorAll('input[name="mode"]')) {
  radio.addEventListener("change", () => {
    if (currentHotspot) loadSpecies(currentHotspot.locId, currentHotspot.locName);
  });
}

$("findHotspots").addEventListener("click", findHotspots);

$("logoutBtn").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" });
  window.location = "/login";
});

$("searchHere").addEventListener("click", () => {
  const center = map.getCenter();
  $("lat").value = center.lat.toFixed(6);
  $("lng").value = center.lng.toFixed(6);
  findHotspots();
});

$("useLocation").addEventListener("click", () => {
  if (!navigator.geolocation) { setStatus("Geolocation not supported by this browser."); return; }
  setStatus("Requesting location permission...");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      $("lat").value = pos.coords.latitude.toFixed(6);
      $("lng").value = pos.coords.longitude.toFixed(6);
      map.setView([pos.coords.latitude, pos.coords.longitude], 13);
      findHotspots();
    },
    (err) => {
      setStatus(`Location error: ${err.message} — geolocation needs HTTPS or localhost.`);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

// Support linking straight to a hotspot: /?locId=L42808575[&lang=es]
async function init() {
  const params = new URLSearchParams(window.location.search);
  const locId = params.get("locId");
  if (params.get("lang")) $("lang").value = params.get("lang");
  if (params.get("mode")) {
    const radio = document.querySelector(`input[name="mode"][value="${params.get("mode")}"]`);
    if (radio) radio.checked = true;
  }

  if (locId) {
    setStatus(`Loading hotspot ${locId}...`);
    const res = await fetch(`/api/hotspots/${locId}`);
    if (res.ok) {
      const h = await res.json();
      $("lat").value = h.lat.toFixed(6);
      $("lng").value = h.lng.toFixed(6);
      map.setView([h.lat, h.lng], 14);
      L.circleMarker([h.lat, h.lng], { radius: 8, color: "#c33", fillColor: "#c33", fillOpacity: 0.8 })
        .addTo(map).bindPopup(popupHTMLNoStats(h)).openPopup();
      await loadSpecies(locId, h.locName);
      return;
    }
    setStatus(`Hotspot ${locId} not found — showing default location instead.`);
  }

  // No (valid) deep link — load the default location's hotspots so the map
  // isn't empty.
  await findHotspots();
}

init();
</script>
</body>
</html>
