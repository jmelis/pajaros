<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pajaros</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1>pajaros</h1>
    <span class="tagline" data-i18n="app.tagline"></span>
  </div>
</header>

<main class="container">
  <!-- Home -->
  <section id="view-home" class="view" hidden>
    <h2 class="view-title" data-i18n="home.title"></h2>
    <div id="homeFirstRun" class="panel first-run" hidden>
      <p data-i18n="home.firstRun"></p>
      <div class="actions"><a class="btn btn-primary" href="#/search" data-i18n="home.find"></a></div>
    </div>
    <section id="homeHotspotsPanel" class="panel">
      <h3 class="panel-title" data-i18n="home.hotspots"></h3>
      <ul id="homeFavorites" class="hotspot-list"></ul>
      <p id="homeNoFavorites" class="hint" data-i18n="home.noFavorites" hidden></p>
      <div class="actions"><a class="btn btn-primary" href="#/search" data-i18n="home.find"></a></div>
    </section>
    <section id="homeProgressPanel" class="panel">
      <h3 class="panel-title" data-i18n="home.progress"></h3>
      <div id="homeProgress" class="settings-stats"></div>
      <div class="actions"><a class="btn btn-secondary" href="#/mastered" data-i18n="home.viewMastered"></a></div>
    </section>
  </section>

  <!-- Search -->
  <section id="view-search" class="view" hidden>
    <h2 class="view-title" data-i18n="search.title"></h2>
    <section class="panel">
      <div class="actions">
        <button id="findHotspots" class="btn btn-primary" type="button" data-i18n="search.find"></button>
        <button id="useLocation" class="btn btn-secondary" type="button" data-i18n="search.useLocation"></button>
      </div>
      <div class="field-grid">
        <label class="field"><span data-i18n="search.lat"></span><input id="lat" type="number" step="any" value="50.8503"></label>
        <label class="field"><span data-i18n="search.lng"></span><input id="lng" type="number" step="any" value="4.3517"></label>
      </div>
      <p class="hint" data-i18n="search.hint"></p>
    </section>
    <section class="panel map-panel">
      <div class="map-toolbar">
        <button id="searchHere" class="btn btn-secondary btn-sm" type="button" data-i18n="search.here"></button>
      </div>
      <div id="map" data-i18n-aria="search.mapAria"></div>
    </section>
    <p id="status" class="status"></p>
  </section>

  <!-- Hotspot -->
  <section id="view-hotspot" class="view" hidden>
    <div class="view-head">
      <h2 id="hotspotName" class="view-title"></h2>
      <button id="bookmarkBtn" class="btn btn-secondary btn-sm" type="button" aria-pressed="false"></button>
    </div>
    <div class="segmented" id="hotspotModeToggle" role="radiogroup" data-i18n-aria="hotspot.modeAria">
      <label><input type="radio" name="hotspotMode" value="browse" checked><span data-i18n="hotspot.browse"></span></label>
      <label><input type="radio" name="hotspotMode" value="quiz"><span data-i18n="hotspot.quiz"></span></label>
    </div>
    <p id="hotspotStatus" class="status"></p>
    <div id="browseControls">
      <div class="segmented" id="modeToggle" role="radiogroup" data-i18n-aria="browse.modeAria">
        <label><input type="radio" name="mode" value="popularity" checked><span data-i18n="browse.popularity"></span></label>
        <label><input type="radio" name="mode" value="category"><span data-i18n="browse.category"></span></label>
        <label><input type="radio" name="mode" value="alphabetical"><span data-i18n="browse.alphabetical"></span></label>
      </div>
      <div id="groups"></div>
    </div>
    <div id="quizControls" class="actions quiz-bar" hidden>
      <label class="field quiz-size"><span data-i18n="quiz.size"></span>
        <select id="quizCount">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="all" data-i18n="quiz.all"></option>
        </select>
      </label>
      <button id="quizStart" class="btn btn-primary" type="button" data-i18n="quiz.start"></button>
    </div>
  </section>

  <!-- Mastered -->
  <section id="view-mastered" class="view" hidden>
    <h2 class="view-title" data-i18n="mastered.title"></h2>
    <p id="masteredStatus" class="status"></p>
    <div id="masteredGrid" class="family-grid"></div>
    <div id="masteredEmpty" class="panel" hidden>
      <p data-i18n="mastered.empty"></p>
      <div class="actions"><a class="btn btn-primary" href="#/search" data-i18n="home.find"></a></div>
    </div>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view" hidden>
    <h2 class="view-title" data-i18n="settings.title"></h2>
    <section class="panel settings-body">
      <label class="field"><span data-i18n="settings.primary"></span>
        <select id="primaryLang"></select>
      </label>
      <label class="field"><span data-i18n="settings.secondary"></span>
        <select id="secondaryLang"></select>
      </label>
      <label class="switch">
        <input id="starRewards" type="checkbox">
        <span data-i18n="settings.starRewards"></span>
      </label>
      <p class="hint" data-i18n="settings.starRewardsHint"></p>
      <div class="settings-stats" id="settingsStats"></div>
      <div class="actions">
        <button id="resetProgress" class="btn btn-secondary" type="button" data-i18n="settings.reset"></button>
        <button id="logoutBtn" class="btn btn-secondary" type="button" data-i18n="settings.signOut"></button>
      </div>
      <p id="settingsHint" class="hint" hidden></p>
    </section>
  </section>
</main>

<nav class="app-nav" data-i18n-aria="nav.aria">
  <a href="#/home" data-nav="home" data-i18n="nav.home"></a>
  <a href="#/search" data-nav="search" data-i18n="nav.search"></a>
  <a href="#/mastered" data-nav="mastered" data-i18n="nav.mastered"></a>
  <a href="#/settings" data-nav="settings" data-i18n="nav.settings"></a>
</nav>

<div id="quizOverlay" class="overlay quiz-overlay" hidden>
  <div class="quiz-top">
    <span id="quizProgress" class="quiz-progress"></span>
    <span id="quizStars" class="quiz-stars" hidden></span>
    <button id="quizClose" class="btn btn-secondary btn-sm" type="button" data-i18n="quiz.close"></button>
  </div>
  <div id="quizBody" class="quiz-body"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
